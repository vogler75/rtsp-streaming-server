services:
  rtsp-streaming-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rtsp-streaming-server
    restart: unless-stopped
    ports:
      - "8080:8080" # Web Dashboard
    volumes:
      # Configuration file
      - ./config.json:/app/config.json:ro
      
      # Camera JSON configs (Read/Write)
      - ./cameras:/app/cameras
      
      # TLS Certificates for HTTPS
      - ./certs:/app/certs:ro

      # Persistent storage for recordings and SQLite database (Read/Write)
      - ./recordings:/app/recordings

    environment:
      - RUST_LOG=info
      - TZ=UTC # Set to your local timezone, e.g., Europe/Paris

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"